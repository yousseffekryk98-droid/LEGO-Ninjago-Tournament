name: Build and release-test fan remake

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  release-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm install
      - run: npm run build
      - name: Generate Capacitor Android project
        run: npx cap add android
      - name: Sync web build into Android
        run: npx cap sync android
      - name: Compile debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ninja-tournament-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
