name: Laptop readiness dependency audit

on:
  push:
    branches: [qa/laptop-readiness]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture exact dependency audit
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --omit=dev --audit-level=moderate
          npm ls --all --json > npm-tree.json || true
      - name: Commit generated lockfile when missing
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock npm dependencies for reproducible laptop installs"
            git push origin HEAD:qa/laptop-readiness
          fi
      - name: Upload audit and generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: laptop-readiness-audit
          path: |
            npm-audit.json
            npm-tree.json
            package-lock.json
