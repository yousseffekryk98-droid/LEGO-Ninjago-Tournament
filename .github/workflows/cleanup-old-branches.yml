name: Cleanup old branches

on:
  push:
    branches:
      - feature/legacy-fidelity-pass
    paths:
      - .github/workflows/cleanup-old-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=(
            "feat/prelaunch-arena-expansion"
            "feature/laptop-readiness-main-port"
            "feature/video-fidelity-economy-spinjitzu-graphics"
            "fix/verified-roster-spinjitzu"
            "qa/laptop-readiness"
            "qa/release-candidate-audit"
            "refactor/characters-models-structure"
            "remake/content-pass-3"
            "remake/fidelity-pass-2"
            "remake/playable-prototype"
          )

          for branch in "${branches[@]}"; do
            url="https://api.github.com/repos/${REPO}/git/refs/heads/${branch}"
            code="$(curl -sS -o /tmp/delete-ref.json -w '%{http_code}' \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${url}")"

            case "${code}" in
              204)
                echo "Deleted ${branch}"
                ;;
              404|422)
                echo "Already absent or protected from deletion: ${branch} (HTTP ${code})"
                cat /tmp/delete-ref.json || true
                ;;
              *)
                echo "Failed deleting ${branch} (HTTP ${code})"
                cat /tmp/delete-ref.json || true
                exit 1
                ;;
            esac
          done
